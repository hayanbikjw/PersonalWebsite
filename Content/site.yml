    title: "'Guildream' steam, stove 출시"
    place: "steam, stove"
    description: "만든 게임을 steam과 stove 양 플랫폼에 출시했습니다."
  - period: "2025.07"
    title: "'TRUMPvsCHESS' itch.io 출시"
    place: "itch.io"
    description: "만든 게임을 처음으로 공개했습니다."
  - period: "2023.12"
    title: "2023 대구x엔젤 인디게임 페스티벌 동상 수상"
    place: "대구콘텐츠비즈니스센터"
    description: "만든 게임으로 인디게임 페스티벌에서 수상하였습니다."
  - period: "2023 — Now"
    title: "인하대학교 컴퓨터공학과 학부 재학중"
    place: "인하대학교"
    description: "인하대학교에서 컴퓨터공학을 전공하고 있습니다."

